name: Android Release Build

# Builds signed Release APK and Google Play App Bundle (AAB) on every push/PR
# that touches the android/ or frontend/ folders, with full Google Play Protect compliance.
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'frontend/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'frontend/**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build Signed Release APK and Play Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure Release Signing Keystore
        working-directory: android
        run: |
          if [ -n "${{ secrets.SIGNING_KEY_BASE64 }}" ]; then
            echo "Using production signing key from GitHub Secrets..."
            echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating automated release signing key for CI artifact..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias census_release \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -storepass census2027 \
              -keypass census2027 \
              -dname "CN=Census Assistant, OU=Census Operations, O=Census Assistant, L=Lakhipur, ST=Assam, C=IN"
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=census2027" >> $GITHUB_ENV
            echo "KEY_ALIAS=census_release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=census2027" >> $GITHUB_ENV
          fi

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build Release APK and Play App Bundle
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify APK Signing Scheme (v1, v2, v3)
        working-directory: android
        run: |
          echo "Verifying Release APK signature..."
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK_PATH"
          else
            echo "ERROR: Release APK not found!"
            exit 1
          fi

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: census-assistant-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Google Play Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: census-assistant-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
