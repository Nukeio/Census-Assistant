plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

import java.util.Properties
import java.io.FileInputStream

// Load keystore.properties if present (keeps secrets outside source control)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'gov.census.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "gov.census.assistant"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Check Environment Variables first (ideal for CI/CD like GitHub Actions)
            def envKeystore = System.getenv("KEYSTORE_FILE")
            def envKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
            def envKeyAlias = System.getenv("KEY_ALIAS")
            def envKeyPassword = System.getenv("KEY_PASSWORD")

            // Check keystore.properties next (ideal for local developer machines)
            def propKeystore = keystoreProperties['storeFile']
            def propKeystorePassword = keystoreProperties['storePassword']
            def propKeyAlias = keystoreProperties['keyAlias']
            def propKeyPassword = keystoreProperties['keyPassword']

            if (envKeystore) {
                def kFile = file(envKeystore).exists() ? file(envKeystore) : rootProject.file(envKeystore)
                if (kFile.exists()) {
                    storeFile kFile
                    storePassword envKeystorePassword
                    keyAlias envKeyAlias
                    keyPassword envKeyPassword
                }
            } else if (propKeystore) {
                def kFile = file(propKeystore).exists() ? file(propKeystore) : rootProject.file(propKeystore)
                if (kFile.exists()) {
                    storeFile kFile
                    storePassword propKeystorePassword
                    keyAlias propKeyAlias
                    keyPassword propKeyPassword
                }
            } else if (rootProject.file("release.keystore").exists()) {
                storeFile rootProject.file("release.keystore")
                storePassword "census2027"
                keyAlias "census_release"
                keyPassword "census2027"
            }

            // Android Gradle Plugin property assignments for modern signature schemes (v1, v2, v3, v4)
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = true
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Assign release signing config if storeFile exists
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Bundle web assets from frontend/
    sourceSets {
        main {
            assets {
                srcDirs += ['../../frontend']
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // OkHttp for backend API requests
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Room database for local offline caching
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
